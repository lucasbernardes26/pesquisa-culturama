<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Pesquisa Online</h1>
    </header>
    <section>
        <form action="" method="">
            <fieldset>
                <legend>Dados Pessoais</legend>
                
                <label for="UserName">Nome</label>
                <input type="text" name="userName" required>
                <br>
                
                <label for="UserAge">Idade</label>
                <input type="number" name="userAge" required min="12" max="100">
                <br>
                
                <label for="userBirthDate">Idade</label>
                <input type="date" name="userBirthDate">
                <br>

                <label for="useEmail">Idade</label>
                <input type="email" name="userEmail" required>
                <br>

                <label for="userPhoneNumber">Telefone</label>
                <input type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="DDD + 111111111">
                <br>

                <label for="userImage">Upload de foto</label>
                <input type="file" accept="image/*" name="userImage">
                <br>

            </fieldset>
            <button type="submit">Enviar</button>
        </form>
    </section>
</body>
</html>
