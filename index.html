<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="culturama-favico.png" type="image/x-icon">
    <title>Pesquisa culturama</title>
</head>
<body>
    <header>
        <img src="img/logo-culturama.png" alt="logo da empresa culturama">
        <h1>Pesquisa de Opinião</h1>
    </header>
    <main>
        <section>
            <form action="sucesso.html" method="">

                <fieldset>
                    <legend>Dados Pessoais</legend>
                    
                    <label for="name">Nome</label>
                    <input id="name" type="text" name="userName" id="name" required>
                    <br>
                    
                    <label for="age">Idade</label>
                    <input id="age" type="number" name="userAge" required min="12" max="100">
                    <br>
                    
                    <label for="birthDate">Data de Nascimento</label>
                    <input id="birthDate" type="date" name="userBirthDate">
                    <br>

                    <label for="email">E-mail</label>
                    <input id="email" type="email" name="userEmail" required>
                    <br>

                    <label for="phoneNumber">Telefone</label>
                    <input id="phoneNumber" type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="DDD + 111111111">
                    <br>

                    <label for="image">Upload de foto</label>
                    <input id="image" type="file" accept="image/*" name="userImage">
                    <br>

                </fieldset>

                <fieldset>
                    <legend>Perfil</legend>

                    <p>Gênero</p>
                    
                    <input id="genderFemale" type="radio" name="userGender" value="female">
                    <label for="genderFemale">Feminino</label>

                    <input id="genderMale" type="radio" name="userGender" value="male">
                    <label for="genderMale">Masculino</label>

                    <input id="genderNotInformed"  type="radio" name="userGender" value="notInformed">
                    <label for="genderNotInformed">Prefiro não informar</label>
                    <br>

                    <label for="maritalStatus">Estado Civil</label>
                    <select name="userMaritalStatus" id="maritalStatus" required>
                    <label for="maritalStatus">Estado Civil</label>
                    <select name="userMaritalStatus" id="maritalStatus" required>
                        <option value="notInformed">Selecione uma opção</option>
                        <option value="solteiro">Solteiro</option>
                        <option value="casado">União estável</option>
                        <option value="divorciado">Divorciado</option>
                    </select>

                    <label for="state">Estado</label>
                    <select name="userState" id="state">
                        <option value="ac">Acre (AC)</option>
                        <option value="al">Alagoas (AL)</option>
                        <option value="ap">Amapá (AP)</option>
                        <option value="am">Amazonas (AM)</option>
                        <option value="ba">Bahia (BA)</option>
                        <option value="ce">Ceará (CE)</option>
                        <option value="df">Distrito Federal (DF)</option>
                        <option value="es">Espírito Santo (ES)</option>
                        <option value="go">Goiás (GO)</option>
                        <option value="ma">Maranhão (MA)</option>
                        <option value="mt">Mato Grosso (MT)</option>
                        <option value="ms">Mato Grosso do Sul (MS)</option>
                        <option value="mg">Minas Gerais (MG)</option>
                        <option value="pa">Pará (PA)</option>
                        <option value="pb">Paraíba (PB)</option>
                        <option value="pr">Paraná (PR)</option>
                        <option value="pe">Pernambuco (PE)</option>
                        <option value="pi">Piauí (PI)</option>
                        <option value="rj">Rio de Janeiro (RJ)</option>
                        <option value="rn">Rio Grande do Norte (RN)</option>
                        <option value="rs">Rio Grande do Sul (RS)</option>
                        <option value="ro">Rondônia (RO)</option>
                        <option value="rr">Roraima (RR)</option>
                        <option value="sc">Santa Catarina (SC)</option>
                        <option value="sp">São Paulo (SP)</option>
                        <option value="se">Sergipe (SE)</option>
                        <option value="to">Tocantins (TO)</option>
                    </select>
                    <br>
                    
                    <label for="city">Cidade</label>
                    <input type="text" name="userCity" id="city">
                </fieldset>
            
                <fieldset>
                    <legend>Hábitos</legend>

                    <p>Redes sociais:</p>
                    <input id="ig" type="checkbox" name="userSocial" value="instagram">
                    <label for="ig">Instagram</label>
                    <br>

                    <input id="fb" type="checkbox" name="userSocial" value="facebook">
                    <label for="fb">Facebook</label>
                    <br>

                    <input id="lkd" type="checkbox" name="userSocial" value="linkedin">
                    <label for="lkd">LinkedIn</label>
                    <br>

                    <input id="x" type="checkbox" name="userSocial" value="x">
                    <label for="x">X</label>
                    <br>

                    <label for="musicStyle">Estilo Musical</label>
                    <input list="styleTypes" id="musicStyle" type="text">
                    <datalist id="styleTypes">
                        <option value="rock">
                        <option value="pop">
                        <option value="samba">
                        <option value="sertanejo">
                    </datalist>
                    <br>
                    <label for="favoriteColor">Cor favorita</label>
                    <input type="color" name="userFavoriteColor" id="favoriteColor">
                </fieldset>

                <fieldset>
                    <legend>Opinião</legend>

                    <p>O que você acha do nosso serviço? </p>
                    <input id="great" type="radio" name="userSatisfaction" value="great">
                    <label for="great">Ótimo</label>
                
                    <input id="ok" type="radio" name="userSatisfaction" value="ok">
                    <label for="ok">Bom</label>
                    
                    <input id="regular" type="radio" name="userSatisfaction" value="regular">
                    <label for="regular">Regular</label>
                
                    <input id="bad" type="radio" name="userSatisfaction" value="bad">
                    <label for="bad">Ruim</label>
                    <br>
                    <br>

                    <label for="comment">Comentário</label>
                    <br>
                    <textarea name="userComment" id="comment" cols="30" rows="10"></textarea>
                </fieldset>

                <fieldset>
                    <legend>Confirmações</legend>

                    <input type="checkbox" name="userLgpd" id="userLgpdTerm" value="accepted" required>
                    <label for="userLgpdTerm">Eu aceito participar da pesquisa</label>
                    <br>
                    <input type="checkbox" name="userGetResult" id="getResult">
                    <label for="getResult">Eu aceito receber o resultado por e-mail</label>
                    <label for="getResult">Eu aceito receber o resultado por e-mail</label>
                </fieldset>

            
                <button type="submit">Enviar</button>
                <button type="reset">Limpar</button>
        
            </form>
        </section>
    </main>
</body>
</html>
